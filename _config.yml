# GitHub Pages Jekyll Configuration
# This file disables Jekyll processing and excludes directories

# Disable Jekyll processing entirely for this project
safe: false
plugins: []

# Exclude directories from Jekyll processing
exclude:
  - backend/venv
  - backend/videos
  - backend/__pycache__
  - frontend/node_modules
  - frontend/.cache
  - frontend/build
  - .git
  - .github
  - "*.egg-info"
  - alembic/versions/__pycache__

# Ensure no defaults are loaded
defaults: []
